name: Kubo compose client

on:
  pull_request:
    paths:
      - "backend/src/quantum_backend_v2/content/**"
      - "backend/src/quantum_backend_v2/config/models.py"
      - "backend/tests/live/test_kubo*.py"
      - "backend/tests/unit/test_kubo*.py"
      - "backend/pyproject.toml"
      - "deploy/kubo-*.sh"
      - "docker-compose.yaml"
      - "scripts/smoke_kubo.py"
      - "scripts/test_kubo*.py"
      - ".github/workflows/kubo-compose-client.yml"
  workflow_dispatch:

concurrency:
  group: kubo-compose-client-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Client add → gateway read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kubo client test dependencies
        # Keep this lean: KuboClient only needs HTTPX/Pydantic, not the full
        # quantum/ML dependency set (torch, qiskit, pyscf, …). Pin the HTTP
        # stack to backend/uv.lock so AsyncByteStream (and friends) match.
        run: |
          uv venv
          uv pip install \
            "httpx==0.28.1" \
            "httpcore==1.0.9" \
            "h11==0.16.0" \
            "pydantic==2.14.1" \
            "python-dotenv>=1.0.1" \
            "pytest>=8.3.0" \
            "anyio==4.15.1"
          uv pip install -e . --no-deps

      - name: Compose Kubo client round-trip
        env:
          QB2_KUBO_COMPOSE_TEST: "1"
        run: uv run --no-sync pytest tests/live/test_kubo_compose_client.py -m kubo_compose -q
