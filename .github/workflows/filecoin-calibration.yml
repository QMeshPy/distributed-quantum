name: Filecoin Calibration

on:
  push:
    paths: ['services/filecoin/**', 'backend/**', '.github/workflows/filecoin-calibration.yml']
  pull_request:
    paths: ['services/filecoin/**', 'backend/**', '.github/workflows/filecoin-calibration.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/filecoin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/filecoin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix services/filecoin
      - name: Install integration test dependencies
        run: >-
          python -m pip install pytest ruff 'pydantic>=2.8,<3' 'httpx>=0.27,<1'
          'beanie>=1.27,<3' 'pymongo>=4.11,<5' 'web3>=7.6,<8'
          'fastapi>=0.115,<1' pyyaml python-dotenv 'pyunormalize<18'
          'py-cid==0.5.0' 'libp2p==0.6.0' 'python-multipart==0.0.32'
          'qiskit==2.3.0' 'qiskit-aer==0.17.2' 'qiskit-algorithms==0.4.0'
      - run: python -m pip install --no-deps -e backend
      - name: Lint Filecoin integration
        run: >-
          ruff check backend/src/quantum_backend_v2/artifacts/filecoin.py
          backend/src/quantum_backend_v2/application/filecoin_*.py
          backend/src/quantum_backend_v2/api/routers/filecoin.py
          backend/scripts/filecoin.py backend/tests/unit/test_filecoin*.py
      - name: Filecoin and adjacent regressions
        env:
          QMESH_TEST_MONGODB_URI: mongodb://localhost:27017
        run: >-
          python -m pytest backend/tests/unit/test_filecoin*.py
          backend/tests/unit/test_peer_tasks.py backend/tests/unit/test_provenance_job.py
          backend/tests/unit/test_provenance_storage_check.py
          backend/tests/unit/test_financial_api.py backend/tests/unit/test_finance_provenance.py -q
