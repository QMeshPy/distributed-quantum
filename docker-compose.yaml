# Production deployment configuration for AWS Lightsail
# Frontend is hosted separately on Vercel
services:
  kubo:
    profiles: ["storage", "monitoring"]
    image: ipfs/kubo:v0.43.1@sha256:b293923d66e490e70ced64df42ea7a6cf7eac2740e3fb29101df18070fa7be48
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker", "--enable-gc"]
    environment:
      IPFS_PROFILE: server
      KUBO_RPC_SECRET: "${KUBO_RPC_SECRET:-}"
      KUBO_STORAGE_MAX: "${KUBO_STORAGE_MAX:-10GB}"
      KUBO_GC_PERIOD: "${KUBO_GC_PERIOD:-1h}"
    volumes:
      - kubo_data:/data/ipfs
      - type: bind
        source: ./deploy/kubo-init.sh
        target: /container-init.d/010-security.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/kubo-storage.sh
        target: /container-init.d/020-storage.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/kubo-rpc.sh
        target: /opt/qmesh/kubo-rpc.sh
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - target: 8080
        published: "${KUBO_GATEWAY_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    # The image binds RPC on port 5001 inside the container; never publish it.
    healthcheck:
      test: ["CMD-SHELL", "sh /opt/qmesh/kubo-rpc.sh diag healthy >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - content_network

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - type: bind
        source: ./deploy/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
    depends_on:
      kubo:
        condition: service_started
    # Neither the UI nor the Kubo metrics/API endpoint is published to the host.
    restart: unless-stopped
    networks:
      - content_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The root deployment file owns backend settings; optional features need no YAML edits.
    env_file:
      - .env
    environment:
      # Caddy and health checks use this fixed internal port.
      QB2_API_HOST: "0.0.0.0"
      QB2_API_PORT: "8080"
      QB2_ENVIRONMENT: "${QB2_ENVIRONMENT:-production}"
      QB2_AUTH_REQUIRED: "${QB2_AUTH_REQUIRED:-true}"
      QB2_PEER_LOG_DIR: /workspace/backend/quantum-backend/peer-logs
      QB2_LIBP2P_PEERSTORE_PATH: /workspace/backend/quantum-backend/libp2p/peerstore.sqlite3
      QB2_LIBP2P_LISTEN_MULTIADDRS: /ip4/0.0.0.0/tcp/4011
      QB2_LIBP2P_DEV_SERVICE_PEER_COUNT: "${QB2_LIBP2P_DEV_SERVICE_PEER_COUNT:-1}"
      KUBO_RPC_SECRET: "${KUBO_RPC_SECRET:-}"
      KUBO_RPC_URL: http://kubo:5001
    ports:
      - "4011:4011"
    volumes:
      - backend_runtime:/workspace/backend/quantum-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ready', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Only expose to Caddy, not to host network
    networks:
      - backend_network
      - content_network

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_DOMAIN: "${API_DOMAIN:-http://localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - backend_network

volumes:
  prometheus_data:
    driver: local
  kubo_data:
    driver: local
  backend_runtime:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  backend_network:
    driver: bridge
  content_network:
    driver: bridge
