[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "quantum-backend"
version = "0.1.0"
description = "Backend v2 foundation for the decentralized quantum service network"
readme = "README.md"
# Cap below 3.14: newer PyPI/libp2p stacks need cffi>=2, which conflicts with
# coinbase-agentkit→nilql→bcl (cffi<2) on the Windows resolution split.
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Quantum Libp2p Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "greenlet>=3.2.4",
  "beanie>=1.27.0",
  "pymongo>=4.11.0",
  "pyyaml>=6.0.2",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "tomli>=2.0.1; python_version < '3.11'",
  "py-multicodec>=1.0.0",
  # Pin a release tag: floating `main` moved to pynacl>=1.6.2 (cffi>=2), which
  # conflicts with coinbase-agentkit→nilql→bcl (cffi<2). Matches prior lock 0.6.0.
  "libp2p @ https://github.com/libp2p/py-libp2p/archive/refs/tags/v0.6.0.tar.gz",
  "python-multipart>=0.0.26",
  "qiskit>=1.2.0",
  "qiskit-aer>=0.15.0",
  "qiskit-algorithms>=0.3.0",
  "qiskit-finance>=0.4.0",
  "yfinance>=0.2.0",
  "scipy>=1.12.0",
  "numpy>=1.26.0",
  # Quantum pharma pipeline
  "pennylane>=0.42.0",
  "pennylane-qiskit>=0.42.0",
  "rdkit>=2024.3.6",
  "openfermion>=1.6.0",
  "openfermionpyscf>=0.5",
  "pyscf>=2.7.0",
  "torch>=2.4.0",
  "biopython>=1.84",
  # Agent orchestration
  "anthropic>=0.18.0",
  "boto3>=1.34.0",
  "coinbase-agentkit>=0.7.4",
  # Pinned for ENS resolution (issue #22). Also pulled transitively by AgentKit;
  # declare explicitly so resolve/reverse APIs stay stable.
  "web3>=7.6.0,<8",
  "cryptography>=43.0.0",
  "motor>=3.3.0",
  "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20250822",
]

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20250822",
]

[project.scripts]
quantum-backend = "quantum_backend_v2.main:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# nilql (via coinbase-agentkit) is published as an alpha; allow it without a
# global --prerelease=allow that would also float other packages.
prerelease = "allow"
# Keep pynacl on the 1.5.x line so cffi stays <2 (required by bcl/nilql).
# pyunormalize 18.x breaks ens.utils.normalize_name (NFC gets a list, not str).
override-dependencies = [
  "pynacl>=1.3.0,<1.6",
  "pyunormalize>=15,<18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_backend_v2"]
